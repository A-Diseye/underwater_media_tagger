[project]
name = "underwater-media-tagger"
version = "0.1.0"
description = "Tag underwater photos and dive videos by subject, with subject-aware color correction."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "imagehash>=4.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
# Heavy GPU dependencies live in their own group so CI can skip them.
ml = [
    "torch>=2.6",
    "torchvision>=0.21",
]

[tool.uv]
default-groups = ["dev", "ml"]

# Pull PyTorch from its CUDA 12.6 wheel index instead of PyPI.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tagger"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
